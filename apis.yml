name: Power2SME
description: >-
  Power2SME operates "India's First Buying Club for SMEs" — a B2B raw-materials
  procurement and SME-financing platform that aggregates demand from small and
  medium enterprises to secure better pricing and access to working capital. The
  company exposes a public version 4 platform API (POWER2SME API) covering SME
  onboarding (Sign Up, Sign In, OTP verification, TrueCaller), password
  lifecycle, SKU and catalog master data, bank/location/entity reference masters,
  credit and holiday-calendar utilities, and email/SMS notification services.
  Surfaced as a portfolio company of Accel and enriched into the API Evangelist
  network from its live Swagger 2.0 documentation.
